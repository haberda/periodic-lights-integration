name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: pip install "Pillow>=12.3.0" ruff
      - name: Runtime tests
        run: python -m unittest discover -s tests -p 'test_runtime*.py'
      - name: Lint
        run: ruff check --select E9,F821,F822,F823 custom_components tests

  homeassistant-tests:
    runs-on: ubuntu-latest
    name: Home Assistant ${{ matrix.homeassistant }}
    strategy:
      fail-fast: false
      matrix:
        # Each harness release pins one Home Assistant release. Test the oldest
        # release hacs.json allows and the newest the harness supports.
        # See "Development" in docs.md before changing these.
        include:
          - homeassistant: "2026.8.0"
            harness: "0.13.354"
          - homeassistant: "2026.10.4"
            harness: "0.13.375"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Home Assistant test harness
        run: pip install "pytest-homeassistant-custom-component==${{ matrix.harness }}"
      - name: Tests inside Home Assistant
        run: pytest --cov=custom_components.periodic_lights --cov-report=term-missing
